<!DOCTYPE html>
<html style="height:100%;">
  <head>
    <style>
      #error {
          background-color: white;
          border: 2px solid black;
          box-shadow: #aaaaaa 6px 6px 2px;
          margin: 2em;
      }
    </style>
  </head>
  <body style="height:100%;">
    <div id="error">
      <table style="width:100%;">
        <tr>
          <td style="padding:1em 1em 0em 1em;width:1px;">
            <img src="/manual-assets/icon-warning.png" alt="warning" style="width:24pt;height:24pt;"/>
          </td><td style="padding-bottom:4pt;vertical-align:bottom;">
            This message cannot be sent successfully, because:
          </td>
        </tr><tr>
          <td colspan="2" style="padding:0em 1em;">
            {{problems}}
          </td>
        </tr>
      </table>
    </div>
    <div>
      <button onclick="history.back()">Back</button>
    </div>
  </body>
</html>
