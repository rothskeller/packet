<!DOCTYPE html>
<html>

<head>
  <title>Packet Messaging</title>
  <style>
    @font-face {
      font-family: Go;
      font-weight: 1 500;
      src: local("Go"),
        local("Go-Regular"),
        local("Go Regular"),
        url("/Go-Regular.woff2") format("woff2");
    }

    @font-face {
      font-family: Go;
      font-weight: 600 1000;
      src: local("Go Bold"),
        local("Go-Bold"),
        url("/Go-Bold.woff2") format("woff2");
    }

    :root {
      --border-width: 1px;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    :root,
    button,
    input,
    select,
    textarea {
      font-family: Go, sans-serif;
      font-size: 1em;
    }

    button,
    input,
    select,
    textarea {
      border: var(--border-width) solid #ccc;
    }

    input:invalid,
    select:invalid,
    textarea:invalid,
    .invalid {
      box-shadow: 0 0 6px 2px #c80000;
      transition: box-shadow 0.5s;
    }

    [hidden] {
      display: none !important;
    }

    body {
      margin: 0;
      display: grid;
      grid: max-content max-content 1fr max-content max-content / auto;
      height: 100vh;
    }

    #topbar {
      height: 3.5rem;
      padding-inline: 0.75rem;
      background-color: #a8e8a8;
      border-bottom: var(--border-width) solid #888;
      display: grid;
      grid: auto / max-content 1fr;
      justify-items: center;
      align-items: center;
    }

    #topleft {
      display: flex;
      align-items: center;
      gap: 1.5rem;
    }

    #logo {
      height: 3rem;
    }

    #slug {
      margin-inline: -0.75rem 1.5rem;
      font-weight: bold;
      font-size: 1.25rem;
      line-height: 1.4rem;
      max-height: 2.8rem;
      overflow: hidden;
    }

    #version {
      font-weight: normal;
      font-size: 0.875rem;
      color: #444;
    }

    #incname {
      font-weight: bold;
      font-size: 1.125rem;
    }

    #topbar button {
      font-size: 1.25rem;
      padding: 0.25rem 0.75rem;
      border: 2px solid #000;
      border-radius: 0.5rem;
      background-color: #efefef;
    }

    #topbar button:hover {
      background-color: #dfdfdf;
    }

    #topbar button:focus {
      outline: 4px solid #005fcc;
      outline-offset: -2px;
    }

    @media (width < 54em) {
      #topleft {
        gap: 0.75rem;
      }

      #slug {
        margin-inline: 0 0.75rem;
      }

      #topbar button {
        font-size: 1rem;
      }
    }
  </style>
  <script>
    function fetch2(a, b) {
      return fetch(a, b).catch(e => {
        return Promise.resolve({
          ok: false,
          status: 500,
          statusText: `PackItForms Server Error`,
          text: () => {
            return Promise.resolve(`This window was unable to communicate with the PackItForms server.  The error was "${e.toString()}".  If it has been a while since last use, the server may have stopped running due to inactivity.  Close this window, start PackItForms again, and retry your operation in a new window.`)
          },
        })
      })
    }
  </script>
</head>

<body data-dir="{{DIR}}">
  <div id=topbar>
    <div id=topleft>
      <img id=logo src="/county-seal.svg">
      <div id=slug>SCCo&nbsp;Packet<br>Messenger <span id=version>v{{VERSION}}</span></div>
    </div>
    <div>
      <div id=incname>{{INCNAME}}</div>
      <div id=ident>{{IDENT}}@{{BBS}}</div>
    </div>
  </div>
</body>

</html>
