<!DOCTYPE html>
<html>

<head>
  <style>
    #topbar {
      height: 3.5rem;
      padding-inline: 0.75rem;
      background-color: #a8e8a8;
      border-bottom: var(--border-width) solid #888;
      display: grid;
      grid: auto / max-content 1fr;
      justify-items: center;
      align-items: center;
    }

    #topleft {
      display: flex;
      align-items: center;
      gap: 1.5rem;
    }

    #logo {
      height: 3rem;
    }

    #slug {
      margin-inline: -0.75rem 1.5rem;
      font-weight: bold;
      font-size: 1.25rem;
      line-height: 1.4rem;
      max-height: 2.8rem;
      overflow: hidden;
    }

    #version {
      font-weight: normal;
      font-size: 0.875rem;
      color: #444;
    }

    #incname {
      font-weight: bold;
      font-size: 1.125rem;
    }

    #topbar button {
      font-size: 1.25rem;
      padding: 0.25rem 0.75rem;
      border: 2px solid #000;
      border-radius: 0.5rem;
      background-color: #efefef;
    }

    #topbar button:hover {
      background-color: #dfdfdf;
    }

    #topbar button:focus {
      outline: 4px solid #005fcc;
      outline-offset: -2px;
    }

    @media (width < 54em) {
      #topleft {
        gap: 0.75rem;
      }

      #slug {
        margin-inline: 0 0.75rem;
      }

      #topbar button {
        font-size: 1rem;
      }
    }
  </style>
</head>

<body>
  <div id=topbar>
    <div id=topleft>
      <img id=logo src="/county-seal.svg">
      <div id=slug>SCCo&nbsp;Packet<br>Messenger <span id=version></span></div>
    </div>
    <div>
      <div id=incname></div>
      <div id=ident></div>
    </div>
  </div>
  <script>
    document.getElementById('version').textContent = `v${incident.version}`
    document.getElementById('incname').textContent = incident.name
    document.getElementById('ident').textContent = `${incident.ident}@${incident.bbs}`
  </script>
</body>

</html>
