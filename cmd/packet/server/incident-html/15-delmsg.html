<!DOCTYPE html>
<html>

<head>
  <script> // Delete Message Dialog
    function setupDeleteMessageDialog() {
      document.getElementById('dmsub').addEventListener('click', async () => {
        const params = new URLSearchParams({dir: incident.dir, id: document.getElementById('dmdlg').dataset.ident})
        const resp = await efetch('/delete-message?' + params.toString(), {method: 'POST'})
        document.getElementById('dmdlg').close()
        if (!resp.ok) openErrorDialog('Delete Message', await resp.text())
      })
      document.getElementById('dmcan').addEventListener('click', () => {
        document.getElementById('dmdlg').close()
      })
    }
    function openDeleteMessageDialog(item) {
      const lmi = item.querySelector('.localID').textContent
      document.getElementById('dmmsgnum').textContent = item.f.includes('R') ? `the unsent receipt for ${lmi}` : `the unsent message ${lmi}`
      document.getElementById('dmdlg').dataset.ident = item.ident
      document.getElementById('dmdlg').showModal()
    }
  </script>
  <style>
    #dmdlg {
      margin: 4rem auto;
      padding: 0 0.75rem 0.75rem;
      z-index: 2;
    }

    #dmdlg h1 {
      background-color: #e7a6a6;
      margin: 0 -0.75rem;
      padding: 0.5rem 0.75rem;
      font-size: 1.5rem;
    }

    #dmmsg {
      max-width: 40rem;
      margin-top: 1.5rem;
    }

    #dmbuttons {
      margin-top: 1.5rem;
      display: flex;
      justify-content: end;
      gap: 0.75rem;
    }

    #dmcan,
    #dmsub {
      border-radius: 0.25rem;
    }

    #dmsub {
      background-color: #e7a6a6;
    }
  </style>
</head>

<body>
  <dialog id=dmdlg>
    <h1>Delete Message</h1>
    <div id=dmmsg>Are you sure you want to delete <span id=dmmsgnum></span>?</div>
    <div id=dmbuttons>
      <button id=dmcan type=button>Cancel</button>
      <button id=dmsub type=button>Delete Message</button>
    </div>
  </dialog>
</body>

</html>
