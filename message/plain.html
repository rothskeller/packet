<!DOCTYPE html>
<style>
  /* Styles copied from SCCoPIFO.css, since we don't want a dependency on it. */
  body {
    margin: 0;
    height: 100vh;
    display: grid;
    grid: max-content 1fr / 100%;
    font-family: sans-serif;
    font-size: 1rem;
  }

  /* FORM CONTROLS AREA: button bar and error display */

  #form-controls {
    margin-bottom: 1.5rem;
  }

  #button-header {
    height: 2.5rem;
    padding-left: 1.5rem;
    border-bottom: 1px solid #888;
    background-color: #aaa;
    display: flex;
    align-items: center;
    gap: 1.5rem;
  }

  #button-header.valid {
    background-color: #a8e8a8;
  }

  input[type=button] {
    border-width: 0.1625rem;
    font-family: sans-serif;
    font-weight: bold;
    font-size: 1rem;
  }

  input[type=button]:focus {
    outline: 0.125rem solid #0261df;
    border-radius: 0.125rem;
  }

  #error {
    display: none;
  }

  #error:not(:empty) {
    display: block;
    margin: 0.75rem 0.75rem 0;
    color: red;
  }

  #error:not(:empty)::before {
    content: "ERROR: ";
  }

  /* FORM AREA LAYOUT */

  /* <div id=form-holder> is a wrapper around the form that provides vertical
 * scrolling.  (We can't put that on the form itself because the form has
 * fixed width, and we want the scroll bar at the right edge of the window
 * rather than the right edge of the form.) */
  #form-holder {
    margin: 0 0.75rem 1.5rem;
    padding: 1px;
    /* Offset negative margins for borders. */
    overflow-y: auto;
  }

  /* <div class=layout-pair> is a particularly common layout grid with two cells:
 * a label and a control. */
  .layout-pair {
    display: grid;
    grid: auto / max-content 1fr;
  }

  /* A horizontal layout arrays things horizontally. */
  .layout-horizontal {
    display: flex;
  }

  /* class=border-thick adds a thick border around its element. */
  .border-thick {
    border: 3px solid #444;
  }

  /* class=colgap puts a small gap between columns. */
  .colgap {
    column-gap: 1rem;
  }

  /* <div class=pair> defines a subgrid spanning two columns of one row of the
 * parent grid for a label and control, with a standard border around both and
 * a gap between them.  It's equivalent to <div class="subgrid border colgap
 * colspan2", plus baseline alignment. */
  .pair {
    grid-column: span 2;
    margin: -1px 0 0 -1px;
    border: 1px solid #aaa;
    padding: 0.25rem;
    display: grid;
    grid: auto / subgrid;
    align-items: baseline;
    column-gap: 1rem;
  }

  /* SECTION HEADERS */

  /* <div class=section-inline> is styled like a section header, but for a cell
 * rather than a row. */
  .section-inline {
    margin: -1px 0 0 -1px;
    border: 1px solid #aaa;
    background-color: #ccc;
    padding: 0.25rem;
    font-weight: bold;
  }

  /* STANDARD HEADERS AND FOOTERS */

  /* <div id=form-header> is the header row at the top of every form that
 * contains its title and version numbers. */
  #form-header {
    margin: -1px 0 0 -1px;
    border: 1px solid #aaa;
    background-color: #deeaf6;
    padding: 0.25rem;
    display: grid;
    grid: auto / 1fr;
    align-items: center;
  }

  /* <div id=form-title> is the left side of <div id=form-header>, containing the
 * form title. */
  #form-title {
    font-size: 1.25rem;
    font-weight: bold;
  }

  /* <div id=form-header-roo> is the "Radio Operator Only" row at the top of each
 * form, with the message numbers. */
  #form-header-roo {
    margin-bottom: 1rem;
    display: grid;
    grid: auto-flow / max-content max-content 1fr max-content 1fr;
    align-items: baseline;
  }

  /* FORM CONTROLS */

  label,
  .label {
    font-weight: bold;
  }

  label:not([for]) {
    margin-left: 1.5rem;
    text-indent: -1.5rem;
  }

  label>input {
    margin-right: 0.375rem;
  }

  input:not([type]) {
    min-width: 0;
    margin: 0;
    border: none;
    padding-inline: 0;
    font-family: "Times New Roman", serif;
    font-size: 1rem;
    color: rgb(0, 0, 153);
  }

  textarea {
    margin: 0;
    border: none;
    font-family: "Times New Roman", serif;
    font-size: 1rem;
    color: rgb(0, 0, 153);
  }

  /* INVALID AREAS */

  input:invalid,
  textarea:invalid,
  .invalid {
    box-shadow: 0 0 6px 2px #c80000;
    background-color: #fff8f8;
  }

  .required-group input[type="checkbox"]:invalid,
  .required-group input[type="radio"]:invalid {
    box-shadow: none;
    background-color: inherit;
  }

  [hidden] {
    display: none !important;
  }
</style>
<script>
  /* Script is copied from pack-it-forms.js to avoid a dependency on it. */
  var required_groups = []
  var the_form

  // UTILITY FUNCTIONS

  function array_for_each(array, func) {
    return Array.prototype.forEach.call(array, func)
  }

  // SHARED FUNCTIONS (idempotent, called in startup and event handlers)

  // Enables or disables the submit buttons based on form validity.
  function adjust_submit() {
    var valid = the_form.checkValidity()
    document.querySelector("#button-header").classList.toggle("valid", valid)
    document.querySelector("#submit").disabled = !valid
    var invalid_example = document.querySelector("#invalid-example")
    invalid_example.hidden = valid
    invalid_example.classList.toggle("hidden", valid)
    return valid
  }

  // Adjusts the pattern of a text field based on its type and required state.
  // For a textarea, it adjusts the invalid class.
  function adjust_pattern(input) {
    var pattern = input.pattern
    if (input.type == "textarea") {
      input.classList.toggle(
        "invalid",
        input.required && (!input.value || !input.value.trim()),
      )
    } else if (input.type == "text") {
      if (pattern == "\\s*\\S.*") pattern = ""
      if (input.required) {
        if (!pattern) {
          pattern = "\\s*\\S.*" // not all white space
        }
      } else if (pattern) {
        pattern += "|\\s*" // all white space
      }
    }
    if (pattern) {
      if (input.pattern != pattern) {
        input.pattern = pattern
      }
    } else if (input.pattern) {
      input.removeAttribute("pattern")
    }
  }

  // Adjusts the required flags on all controls in a required group.
  function adjust_required_group(group) {
    if (group.querySelector(":checked") || group.closest("[hidden]") || !group.classList.contains('required-group')) {
      group.querySelectorAll("input[type=checkbox]:required").forEach((r) => {
        r.required = false
      })
      group.classList.remove("invalid")
    } else {
      let haveRequired = false,
        seenRFC = false
      group
        .querySelectorAll('input[type="checkbox"],input[type="radio"]')
        .forEach((r) => {
          if (r.disabled) return
          r.required = true
          haveRequired = true
        })
      group.classList.toggle("invalid", haveRequired)
    }
  }

  // Adjusts the required flags on all controls in required groups.
  function adjust_required_groups() {
    required_groups.forEach(adjust_required_group)
    adjust_submit()
  }

  // Adjusts the required and disabled flags of controls based on required-if,
  // allowed-if, and else-disallowed attributes.
  function adjust_required_disabled() {
    document
      .querySelectorAll(
        "input[type=checkbox],input[type=radio],input[type=text],input:not([type]),select,textarea",
      )
      .forEach((elm) => {
        if (elm.closest("[hidden]")) return
        adjust_pattern(elm)
      })
    adjust_required_groups()
  }

  // EVENT HANDLERS

  // Triggered on any form input.
  function on_form_input() {
    adjust_submit()
  }

  // Triggered when a control in a required-group changes.
  function on_required_group_change(evt) {
    adjust_required_group(evt.target.closest(".required-group"))
    adjust_submit()
  }

  // Triggered by Reset Form button.
  function on_reset() {
    the_form.reset()
    reset_form()
  }

  // Triggered by Submit or Save button.
  async function on_submit(evt) {
    const submit = evt.target.id == "submit"
    if (submit && !adjust_submit()) return
    const fd = new FormData(the_form)
    if (submit) fd.set("readyToSend", "true")
    const resp = await fetch(the_form.action, {
      method: "POST",
      body: fd,
      redirect: "manual",
    })
    if (resp.status == 204) {
      const action = resp.headers.get("X-Packet-Action")
      if (action.startsWith("redirect:")) location.href = action.substring(9)
      else {
        window.opener.childAction(resp.headers.get("X-Packet-Action"))
        window.close()
      }
    } else document.getElementById("error").textContent = await resp.text()
  }

  // RESET FUNCTIONS (run at startup and whenever the form is reset)

  function reset_form() {
    adjust_required_disabled()
  }

  // SETUP FUNCTIONS (run only once)

  // Ping the server periodically, to keep it alive while this page is open.
  function start_pings() {
    setInterval(function ping() {
      var img = new Image()
      // To discourage caching, use a new query string for each ping.
      img.src = "/ping?i=" + Math.random()
      img = undefined
    }, 30000) // every 30 seconds
  }

  // Sets up required groups.
  function setup_required_groups() {
    required_groups = Array.from(document.querySelectorAll(".required-group,.was-required-group"))
    required_groups.forEach((g) => {
      g.addEventListener("change", on_required_group_change)
    })
    adjust_required_disabled()
  }

  // Sets the properties of an input that only need to be set once on startup.
  // These include placeholder, title, shift-click handler for radio buttons.
  function setup_input_once(input) {
    if (!input.title && input.placeholder) {
      input.title = input.placeholder
    }
    if (input.type == "radio") {
      input.addEventListener("click", (evt) => {
        if (evt.shiftKey && !input.required) input.checked = false
      })
    }
  }

  function setup_buttons() {
    document.getElementById("submit").addEventListener("click", on_submit)
    document.getElementById("reset").addEventListener("click", on_reset)
    const save = document.getElementById("save")
    if (save) save.addEventListener("click", on_submit)
  }

  function set_initial_focus() {
    const invalid = document.querySelector('input:invalid,select:invalid,textarea:invalid')
    if (invalid) invalid.focus()
  }

  window.addEventListener("load", function () {
    the_form = document.getElementById("the-form")
    start_pings()
    setup_required_groups()
    array_for_each(the_form.elements, setup_input_once)
    setup_buttons()
    the_form.addEventListener("input", on_form_input)
    reset_form()
    set_initial_focus()
  })
</script>
<title>Plain Text Message</title>
<div id=form-controls>
  <div id=button-header>
    <input type=button id=submit disabled value="Submit Form" value={{submit-label}}>
    <if:save-label>
      <input type=button id=save value={{save-label}}>
    </if:save-label>
    <input type=button id=reset value="Reset Form">
    <span id=invalid-example>
      <input class=invalid disabled style="margin-left:1em;width:2em;border:1px solid #cccccc;" />
      <span>&nbsp;&nbsp;= required</span>
    </span>
  </div>
  <div id=error></div>
</div>
<div id=form-holder>
  <form id=the-form method=POST action={{submit-url}} style="width:60rem">
    <div id=form-header>
      <div id=form-title>Plain Text Message</div>
    </div>
    <div id=form-header-roo>
      <div class=section-inline>Radio Operator Only:</div>
      <div class=pair>
        <label for=MsgNo>Origin Msg #:</label>
        <input id=MsgNo name=MsgNo class=message-number required>
      </div>
      <div class=pair>
        <label for=DestMsgNo>Destination Msg #:</label>
        <input id=DestMsgNo name=DestMsgNo class=message-number disabled>
      </div>
    </div>
    <div class=border-thick>
      <div class=layout-pair>
        <if:show-addrs>
          <div class=pair>
            <label for=FromAddr>From:</label>
            <input id=FromAddr name=FromAddr readonly>
          </div>
          <div class=pair>
            <label for=ToAddr>To:</label>
            <input id=ToAddr name=ToAddr required>
          </div>
        </if:show-addrs>
        <div class=pair>
          <div class=label>Handling:</div>
          <div class="layout-horizontal colgap required-group">
            <label>
              <input type=radio name=handling required value=IMMEDIATE>Immediate
              <span>(ASAP)</span>
            </label>
            <label>
              <input type=radio name=handling required value=PRIORITY>Priority
              <span>(&lt;1 hr)</span>
            </label>
            <label>
              <input type=radio name=handling required value=ROUTINE>Routine
              <span>(&lt;2 hrs)</span>
            </label>
          </div>
        </div>
        <div class=pair>
          <label for=subject>Summary:</label>
          <input id=subject name=subject required>
        </div>
        <div class=pair>
          <label for=body>Message</label>
          <textarea id=body name=body rows=10></textarea>
        </div>
      </div>
    </div>
  </form>
</div>
