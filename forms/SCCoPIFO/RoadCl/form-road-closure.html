<!DOCTYPE html>
<link rel=stylesheet type=text/css href={{assets}}/pack-it-forms.css>
<style>
  .annotation {
    font-size: 80%;
    font-weight: normal
  }
</style>
<script type=text/javascript src={{assets}}/pack-it-forms.js></script>
<title>Road Closure</title>
<the-form>
  <scco-header form-title="Road Closure" paper-version="PDF: 20250812"
    to-ics-positions="Public Works Group; Construction &amp; Eng. Branch; Operations"></scco-header>
  <table class=veoci>
    <caption>Initial Information
    <tr>
      <td class=label>Jurisdiction:
      <td class=input><jurisdiction-box name="20." tabindex=20></jurisdiction-box>
    <tr>
      <td class=label>Road/Intersection:
      <td class=input><input type=text name=21. tabindex=20 required>
    <tr>
      <td class=label>Location:
      <td class=input><textarea name=22. tabindex=20 required></textarea>
    <tr>
      <td class=label>Details:
      <td class=input><textarea name=23. tabindex=20 required></textarea>
    <tr>
      <td class=label>Status:
      <td class=input>
        <table class="boxgroup required-group">
          <tr>
            <td><input type=radio name=24. value="Planned Closure" tabindex=20 required>Planned Closure
            <td><input type=radio name=24. value=Closed tabindex=20 required>Closed
            <td><input type=radio name=24. value=Reopened tabindex=20 required>Reopened
        </table>
  </table>
  <table class=veoci>
    <caption>Closure Time
    <tr>
      <td class=label>Closure Start Date:
      <td class=input><input type=text name=30d. class=date tabindex=30>
      <td class=label>Closure Start Time:
      <td class=input><input type=text name=30t. class=time tabindex=30 required-if=30d.start-date else-disallowed>
    <tr>
      <td class=label>Closure End Date:
      <td class=input><input type=text name=31d. class=date tabindex=30>
      <td class=label>Closure End Time:
      <td class=input><input type=text name=31t. class=time tabindex=30 required-if=31d.end-date else-disallowed>
  </table>
  <scco-footer></scco-footer>
</the-form>
